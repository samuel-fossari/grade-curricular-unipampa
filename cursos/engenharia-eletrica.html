<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Grade interativa de Engenharia Elétrica (UNIPAMPA Alegrete): PPC, pré-requisitos e estados das disciplinas." />
  <title>Engenharia Elétrica · Grade interativa — UNIPAMPA Alegrete</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.34.0/dist/tabler-icons.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div id="app">
    <main id="main" class="main-content">
      <header class="page-header">
        <div class="page-header-left">
          <h1 id="pageTitle">Grade Curricular</h1>
        </div>
        <div class="page-header-right">
          <span id="headerProgressPill" class="header-progress-pill" role="status" aria-live="polite">0 / 0 concluídas</span>
        </div>
      </header>
      <div class="page-strip">
        <div class="course-progress-row" aria-label="Progresso de conclusão da grade">
          <div
            id="headerProgressBar"
            class="course-progress-track"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            aria-valuetext="0% (0 de 0 concluídas)"
            aria-label="Percentual de disciplinas concluídas"
          >
            <div id="headerProgressFill" class="course-progress-fill"></div>
          </div>
          <span id="headerProgressPct" class="course-progress-pct">0%</span>
        </div>
        <div class="stats-row stats-row--compact">
          <div class="stat-chip"><span class="stat-chip-val" id="statDone">0</span><span class="stat-chip-lbl">Concluídas</span></div>
          <div class="stat-chip"><span class="stat-chip-val" id="statProgress">0</span><span class="stat-chip-lbl">Em andamento</span></div>
          <div class="stat-chip"><span class="stat-chip-val" id="statAvail">0</span><span class="stat-chip-lbl">Disponíveis</span></div>
          <div class="stat-chip"><span class="stat-chip-val" id="statLocked">0</span><span class="stat-chip-lbl">Bloqueadas</span></div>
          <div class="stat-chip"><span class="stat-chip-val" id="statTotal">0</span><span class="stat-chip-lbl">Total</span></div>
        </div>
        <div class="status-legend status-legend--compact" aria-label="Legenda de status">
          <span class="stl-item"><span class="stl-dot" style="background:var(--done)"></span>Concluída</span>
          <span class="stl-sep">·</span>
          <span class="stl-item"><span class="stl-dot" style="background:var(--progress)"></span>Em andamento</span>
          <span class="stl-sep">·</span>
          <span class="stl-item"><span class="stl-dot" style="background:var(--ready)"></span>Disponível</span>
          <span class="stl-sep">·</span>
          <span class="stl-item"><span class="stl-dot" style="background:var(--locked)"></span>Bloqueada</span>
        </div>
      </div>
      <div class="grid-area">
        <div class="grid" id="grid"></div>
      </div>
    <div id="status-announcer" role="status" aria-live="polite" aria-atomic="true" style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;"></div>
    <div id="detailDialog" class="dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-hidden="true">
      <div class="dialog-panel">
        <div class="dialog-head">
          <h2 id="dialog-title"></h2>
          <button type="button" class="dialog-close" aria-label="Fechar diálogo">×</button>
        </div>
        <div id="dialogBody" class="dialog-body"></div>
      </div>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <footer class="page-disclaimer-footer" role="contentinfo">Projeto acadêmico independente · Dados baseados nos PPCs públicos da UNIPAMPA · Desenvolvido por um aluno de ES</footer>
    </main>
  </div>
  <script src="../js/sidebar.js"></script>
  <script src="../js/siteprefs.js"></script>
  <script src="../js/sw-register.js"></script>
  <script src="../js/mobile-nav.js"></script>
  <script src="../js/cursos/ee.js"></script>
  <script src="../js/main.js"></script>
</body>
</html>

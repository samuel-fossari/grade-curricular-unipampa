<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Entre na sua conta para sincronizar progresso, CCCGs e horários entre dispositivos." />
  <title>Conta — Grades UNIPAMPA Alegrete</title>
  <link rel="icon" href="assets/favicon.png" type="image/png" />
  <link rel="stylesheet" href="assets/vendor/source-sans-3.css" />
  <link rel="stylesheet" href="assets/vendor/tabler-icons.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/theme-init.js"></script>
</head>
<body>
  <div id="app">
    <main id="main" class="main-content">
      <header class="page-header">
        <div class="page-header-left">
          <h1>Conta</h1>
        </div>
        <div class="page-header-right">
          <span class="header-progress-pill header-progress-pill--muted">Login e nuvem</span>
        </div>
      </header>
      <div class="grid-area grid-area--prefs grid-area--auth">
        <section class="prefs-panel auth-panel" aria-labelledby="auth-h">
          <h2 id="auth-h" class="prefs-h auth-panel__title">Entrar na sua conta</h2>
          <p class="prefs-desc auth-panel__lead">
            Salve progresso, CCCGs e horários na nuvem. Sem login, os dados ficam só neste navegador.
          </p>
          <p id="cloudAccountStatus" class="prefs-desc prefs-desc--status" role="status">Carregando…</p>

          <div id="cloudSignedOut">
            <button type="button" class="a11y-btn a11y-btn--primary a11y-btn--block" id="cloudGoogleBtn">
              <i class="ti ti-brand-google" aria-hidden="true"></i>
              Entrar com Google
            </button>
            <p class="auth-divider" aria-hidden="true">ou</p>
            <label class="prefs-field" for="cloudEmail">
              <span class="prefs-k">E-mail</span>
              <input type="email" id="cloudEmail" class="a11y-input prefs-input-wide" autocomplete="email" />
            </label>
            <label class="prefs-field" for="cloudPassword">
              <span class="prefs-k">Senha</span>
              <input type="password" id="cloudPassword" class="a11y-input prefs-input-wide" autocomplete="current-password" />
            </label>
            <div class="prefs-row prefs-row--wrap auth-actions">
              <button type="button" class="a11y-btn a11y-btn--primary" id="cloudSignInBtn">Entrar</button>
              <button type="button" class="a11y-btn" id="cloudSignUpBtn">Criar conta</button>
            </div>
          </div>

          <div id="cloudSignedIn" hidden>
            <div class="prefs-row prefs-row--wrap auth-actions">
              <button type="button" class="a11y-btn a11y-btn--primary" id="cloudPushBtn">Salvar na nuvem</button>
              <button type="button" class="a11y-btn" id="cloudPullBtn">Carregar da nuvem</button>
              <button type="button" class="a11y-btn" id="cloudSignOutBtn">Sair</button>
            </div>
            <label class="prefs-check">
              <input type="checkbox" id="cloudPullMerge" />
              Mesclar ao carregar (não substituir tudo)
            </label>
            <p class="prefs-desc auth-panel__hint">
              Tema e tamanho da fonte também são sincronizados quando você salva na nuvem.
            </p>
          </div>

          <p id="cloudFeedback" class="prefs-feedback" hidden role="status"></p>
        </section>
      </div>
    </main>
  </div>
  <script src="js/sidebar.js"></script>
  <script src="js/siteprefs.js"></script>
  <script src="js/sw-register.js"></script>
  <script src="js/mobile-nav.js"></script>
  <script src="js/grade-storage.js"></script>
  <script src="js/auth/supabase-config.js"></script>
  <script src="js/auth/supabase-client.js"></script>
  <script src="js/auth/session.js"></script>
  <script src="js/sync/cloud-sync.js"></script>
  <script src="js/auth/account-panel.js"></script>
</body>
</html>
